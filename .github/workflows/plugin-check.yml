name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: az-notifyrules-for-woocommerce
          exclude-directories: .github
          exclude-files: .gitignore
          # This plugin is distributed outside WordPress.org and therefore
          # intentionally provides its own signed update metadata.
          exclude-checks: plugin_updater
